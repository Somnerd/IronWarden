[package]
name = "mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
iw_core = { path = "../core" }
worker = { path = "../worker" }
tokio = { version = "1.0", features = ["io-util", "io-std", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4"] }
dashmap = "6.1.0"
secrecy = "0.8.0"
