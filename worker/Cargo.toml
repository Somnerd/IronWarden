[package]
name = "worker"
version = "0.1.30-alpha"
edition = "2021"

[dependencies]
iw_core = { path = "../core" }
iw-warden = { path = "../warden" }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1.0"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
aes-gcm = "0.10"
aead = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libc = "0.2"

# SearchBoost Bridge Dependencies
axum = { version = "0.7", features = ["macros"] }
tower_governor = "0.4"
serde-pickle = "1.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
dashmap = "6.1.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
tantivy = "0.22"
lancedb = "0.27"
redis = { version = "0.27", features = ["tokio-comp"] }
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
secrecy = "0.8.0"
bincode = "1.3.3"
flume = "0.12.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"


[dev-dependencies]
tempfile = "3.10"
iw-warden = { path = "../warden" }
criterion = "0.5"

[[bench]]
name = "searchboost_benchmark"
harness = false

