[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
iw_core = { path = "../core" }
iw-warden = { path = "../warden" }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1.0"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
aes-gcm = "0.10"
aead = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# SearchBoost Bridge Dependencies
axum = { version = "0.7", features = ["macros"] }
tower_governor = "0.4"
serde-pickle = "1.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
dashmap = "6.1.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
lancedb = "0.10.0"
futures = "0.3"
arrow-array = "52"
secrecy = "0.8.0"
bincode = "1.3.3"

[dev-dependencies]
tempfile = "3.10"
