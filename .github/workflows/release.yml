name: Release & Binary Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Release Binaries
        run: |
          cargo build --release --bin app --bin iw-cli

      - name: Package Artifacts
        shell: bash
        run: |
          RELEASE_DIR="ironwarden-x86_64-unknown-linux-gnu"
          mkdir -p "$RELEASE_DIR"
          
          # Copy binaries
          cp "target/release/app" "$RELEASE_DIR/ironwarden"
          cp "target/release/iw-cli" "$RELEASE_DIR/iw-cli"
          
          # Copy configuration templates & documentation
          cp example.env "$RELEASE_DIR/example.env"
          cp LICENSE "$RELEASE_DIR/LICENSE"
          cp README.md "$RELEASE_DIR/README.md"
          
          # Create compressed archive
          tar -czvf "ironwarden-x86_64-unknown-linux-gnu.tar.gz" "$RELEASE_DIR"
          
          # Generate SHA-256 Checksum
          sha256sum "ironwarden-x86_64-unknown-linux-gnu.tar.gz" > "ironwarden-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ironwarden-x86_64-unknown-linux-gnu
          path: |
            ironwarden-x86_64-unknown-linux-gnu.tar.gz
            ironwarden-x86_64-unknown-linux-gnu.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Aggregate Checksums
        shell: bash
        run: |
          mkdir -p dist
          find release-artifacts -type f -name "*.tar.gz" -exec cp {} dist/ \;
          find release-artifacts -type f -name "*.sha256" -exec cat {} + > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ "$TAG" == *"main"* ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-rc"* || "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          else
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          fi
