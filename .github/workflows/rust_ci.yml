name: Rust CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WARDEN_MCP_SECRET: "dummy_mcp_secret_value_for_testing_purposes"
  LD_LIBRARY_PATH: "$HOME/lib:/usr/local/lib:/usr/lib"

jobs:
  lint:
    name: Format & Clippy
    timeout-minutes: 20
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Cargo PATH
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          if [ -d "/home/somnerd/.cargo/bin" ]; then
            echo "/home/somnerd/.cargo/bin" >> $GITHUB_PATH
          fi
          if [ -d "/home/somnerd/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" ]; then
            echo "/home/somnerd/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" >> $GITHUB_PATH
          fi

      - name: Install System Dependencies
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Set up Rust Toolchain
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup default stable
            rustup component add clippy rustfmt
          fi

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test Suite (Unit & Integration)
    needs: lint
    timeout-minutes: 45
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Cargo PATH
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          if [ -d "/home/somnerd/.cargo/bin" ]; then
            echo "/home/somnerd/.cargo/bin" >> $GITHUB_PATH
          fi
          if [ -d "/home/somnerd/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" ]; then
            echo "/home/somnerd/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" >> $GITHUB_PATH
          fi

      - name: Install System Dependencies
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Set up Rust Toolchain
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup default stable
            rustup component add clippy rustfmt
          fi

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyjwt cryptography requests httpx redis PyYAML

      - name: Prepare Test Manifests & Models
        run: |
          ./scripts/setup/setup_models.sh

      - name: Run Rust Tests
        env:
          WARDEN_NER_MODE: require_hybrid
        run: cargo test --workspace --lib --bins --tests

      - name: Build App Binary
        run: cargo build -p app

      - name: Run Python Integration Test Suite
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pytest tests/e2e/ --timeout=180 -k "not stress and not benchmark" -v
