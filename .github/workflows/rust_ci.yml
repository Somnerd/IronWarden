name: Rust CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WARDEN_MCP_SECRET: "dummy_mcp_secret_value_for_testing_purposes"

jobs:
  lint:
    name: Format & Clippy
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: true


      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test Suite (Unit & Integration)
    needs: lint
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyjwt cryptography requests httpx redis PyYAML

      - name: Prepare Test Manifests
        run: |
          mkdir -p integration_tests
          cp warden/test_manifest_*.yaml integration_tests/ 2>/dev/null || true
          cp app/test_manifest_legal.yaml /tmp/manifest_legal.yaml 2>/dev/null || true

      - name: Run Rust Tests
        run: cargo test --workspace --lib --bins --tests

      - name: Run Python Integration Test Suite
        run: pytest test_suites/ -k "not stress and not benchmark" -v

