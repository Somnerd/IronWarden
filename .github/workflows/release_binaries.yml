name: Release Precompiled Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true

          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            use_cross: false

          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            use_cross: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protoc (Linux/macOS)
        if: runner.os != 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-RS
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binaries (Standard)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Build Binaries (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bins

      - name: Package Release Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          PKG_NAME="ironwarden-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/app" "dist/${PKG_NAME}/ironwarden" 2>/dev/null || cp "target/${{ matrix.target }}/release/ironwarden" "dist/${PKG_NAME}/ironwarden"
          cp "target/${{ matrix.target }}/release/iw-cli" "dist/${PKG_NAME}/iw" 2>/dev/null || cp "target/${{ matrix.target }}/release/iw" "dist/${PKG_NAME}/iw"
          cp LICENSE "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"
          cp -r config "dist/${PKG_NAME}/"
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          PKG_NAME="ironwarden-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp target/${{ matrix.target }}/release/app.exe dist/${PKG_NAME}/ironwarden.exe 2>/dev/null || cp target/${{ matrix.target }}/release/ironwarden.exe dist/${PKG_NAME}/ironwarden.exe
          cp target/${{ matrix.target }}/release/iw-cli.exe dist/${PKG_NAME}/iw.exe 2>/dev/null || cp target/${{ matrix.target }}/release/iw.exe dist/${PKG_NAME}/iw.exe
          cp LICENSE "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"
          cp -r config "dist/${PKG_NAME}/"
          cd dist
          7z a "${PKG_NAME}.zip" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
