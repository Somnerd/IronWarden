[package]
name = "iw_core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.0"
secrecy = "0.8.0"
moka = { version = "0.12", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
