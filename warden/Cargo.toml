[package]
name = "iw-warden"
version = "0.1.52-alpha"
edition = "2021"

[dependencies]
iw_core = { path = "../core" }
aho-corasick = "1.1"
regex = "1.10"
unicode-normalization = "0.1"
base64 = "0.22"
once_cell = "1.19"
any_ascii = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1.44"
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "time", "net", "io-util"] }
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
tokenizers = "0.19"
async-trait = "0.1"
futures = "0.3"
console = { version = "0.16", features = ["std"] }
aes-gcm = "0.10"
aead = "0.5"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.7"
rand = "0.8"
secrecy = { version = "0.8", features = ["serde"] }
flume = "0.12.0"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "engine_benchmark"
harness = false
[[bench]]
name = "ner_benchmark"
harness = false

[build-dependencies]
cc = "1.2.65"

