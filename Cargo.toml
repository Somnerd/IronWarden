[workspace]
resolver = "2"
members = [
    "core",
    "mcp",
    "warden",
    "worker",
    "app",
    "cli",
    "integration_tests",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Nikolas Alexandrakis <nikolasalexandrakis@Jos.home>"]
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
iw_core = { path = "core", version = "1.0.0" }
iw-warden = { path = "warden", version = "1.0.0" }
iw_worker = { path = "worker", version = "1.0.0" }
iw_mcp = { path = "mcp", version = "1.0.0" }
warden = { package = "iw-warden", path = "warden", version = "1.0.0" }
worker = { package = "iw_worker", path = "worker", version = "1.0.0" }
mcp = { package = "iw_mcp", path = "mcp", version = "1.0.0" }

# Async & Runtime
tokio = { version = "1.43", features = ["rt", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
flume = "0.12"
crossbeam-channel = "0.5"

# Web, HTTP & Networking
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tower = { version = "0.4", features = ["util"] }
tower_governor = "0.4"
http-body-util = "0.1"
bytes = "1.10"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde-pickle = "1.2"
bincode = "1.3.3"
dotenvy = "0.15"

# Security, Cryptography & Identity
secrecy = { version = "0.8.0", features = ["serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
aes-gcm = "0.10.3"
aead = "0.5"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
rand = "0.8"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
openssl = "0.10.81"

# Database & Storage
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
redis = { version = "0.27", features = ["tokio-comp"] }
lancedb = "0.27"
arrow-array = "57"
arrow-schema = "57"
tantivy = "0.22"

# Utilities & Data Structures
dashmap = "6.1"
moka = { version = "0.12", features = ["sync"] }
arc-swap = "1.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
once_cell = "1.19"
any_ascii = "0.3"
console = { version = "0.16", features = ["std"] }

# Text, String & Pattern Processing
aho-corasick = "1.1"
regex = "1.11"
unicode-normalization = "0.1"
base64 = "0.22.1"

# AI / ML
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
tokenizers = "0.19"

# Document & Image Processing
pdf-extract = "0.12.0"
docx-rs = "0.4.22"
zip = "8.6.0"
quick-xml = "0.41.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Build & Dev Dependencies
tempfile = "3.17"
proptest = "1.6"
criterion = "0.5"
cc = "1.2"

[profile.dev]
debug = 1

[profile.test]
debug = 1

# Strip bulky debug symbols for third-party dependencies to keep build footprint < 1.5GB
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
