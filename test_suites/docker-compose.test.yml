services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ironwarden_test
      POSTGRES_USER: somnerd
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somnerd -d ironwarden_test"]
      interval: 2s
      timeout: 5s
      retries: 5

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
