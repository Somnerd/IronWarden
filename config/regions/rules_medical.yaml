rules:
  - id: "medical_record_number"
    type: "Regex"
    pattern: '(?i)\b(?:MRN|MR)[- ]?\d{4,10}\b'
    category: "IdentificationNumber"
    action: Redact

  - id: "national_provider_identifier"
    type: "Regex"
    pattern: '\b[12]\d{9}\b'
    category: "IdentificationNumber"
    action: Redact

  - id: "medicare_mbi"
    type: "Regex"
    pattern: '(?i)\b[1-9][a-z0-9]{2}[0-9][a-z0-9]{2}[0-9][a-z0-9]{2}[0-9]{2}\b'
    category: "IdentificationNumber"
    action: Redact

  - id: "prescription_number"
    type: "Regex"
    pattern: '(?i)\b(?:RX|Rx|Prescription)[- ]?\d{5,12}\b'
    category: "IdentificationNumber"
    action: Redact

  - id: "icd10_code"
    type: "Regex"
    pattern: '(?i)\b[a-z]\d{2}(?:\.\d{1,4})?\b'
    category: "InternalAsset"
    action: Redact

heuristics:
  - label: "POTENTIAL_DISEASE"
    pattern: '(?i)\b(?:diabetes|cancer|leukemia|asthma|hypertension|covid-19|influenza|depression|anxiety|dementia|alzheimer|arthritis|cardiovascular disease|tuberculosis)\b'
    category: "Other"
    action: AuditOnly

  - label: "POTENTIAL_DRUG_NAME"
    pattern: '(?i)\b(?:Lipitor|Synthroid|Humira|Keytruda|Revlimid|Eliquis|Imbruvica|Stelara|Eylea|Biktarvy|Xarelto|Opdivo|Prevnar|Neulasta|Prolia|Enbrel|Soliris|Lantus|Ibrance|Neulasta|Adalimumab|Atorvastatin|Levothyroxine|Metformin|Lisinopril|Amlodipine|Albuterol|Gabapentin|Sertraline|Omeprazole)\b'
    category: "Other"
    action: AuditOnly

ai_enabled: true
ai_confidence_threshold: 0.85
