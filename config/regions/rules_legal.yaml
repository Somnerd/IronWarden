rules:
  - id: "gr_afm"
    type: "Regex"
    pattern: '\b[0-9]{9}\b'
    category: "IdentificationNumber"
  
  - id: "gr_amka"
    type: "Regex"
    pattern: '\b(?:0[1-9]|[12]\d|3[01])(?:0[1-9]|1[0-2])\d{2}\d{5}\b'
    category: "IdentificationNumber"

  - id: "eu_iban"
    type: "Regex"
    pattern: '[A-Z]{2}\d{2}[A-Z0-9]{11,30}'
    category: "FinancialData"

  - id: "case_id"
    type: "Regex"
    pattern: '\bLAW-[0-9]{4}-[A-Z0-9]+\b'
    category: "InternalAsset"
  
  - id: "gr_phone"
    type: "Regex"
    pattern: '\b(2[0-9]{9}|69[0-9]{8})\b'
    category: "ContactInfo"

  - id: "gr_postal"
    type: "Regex"
    pattern: '\b[1-8][0-9]{4}\b'
    category: "ContactInfo"

heuristics:
  - label: "POTENTIAL_CLIENT_NAME"
    pattern: '\b[A-Z\u0391-\u03A9][a-z\u03B1-\u03C9\u03AC-\u03CE]+ [A-Z\u0391-\u03A9][a-z\u03B1-\u03C9\u03AC-\u03CE]+\b'
    skip_sentence_start: true
    category: "IndividualName"

ai_enabled: true
ai_confidence_threshold: 0.85
