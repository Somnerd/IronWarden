rules:
  - id: "gr_afm"
    type: "Regex"
    pattern: '\b[0-9]{9}\b'
  
  - id: "gr_amka"
    type: "Regex"
    pattern: '\b[0-9]{11}\b'

  - id: "eu_iban"
    type: "Regex"
    pattern: '[A-Z]{2}\d{2}[A-Z0-9]{11,30}'

  - id: "case_id"
    type: "Regex"
    pattern: '\bLAW-[0-9]{4}-[A-Z0-9]+\b'
  
  - id: "gr_phone"
    type: "Regex"
    pattern: '\b(2[0-9]{9}|69[0-9]{8})\b' # Mobile and Landline (basic)

  - id: "gr_postal"
    type: "Regex"
    pattern: '\b[1-8][0-9]{4}\b' # 5-digit Greek postal code

heuristics:
  - label: "POTENTIAL_CLIENT_NAME"
    pattern: '\b[A-Z\u0391-\u03A9][a-z\u03B1-\u03C9\u03AC-\u03CE]+ [A-Z\u0391-\u03A9][a-z\u03B1-\u03C9\u03AC-\u03CE]+\b'
    skip_sentence_start: true

ai_enabled: true
ai_confidence_threshold: 0.85
