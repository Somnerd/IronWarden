rules:
  - id: "gr_afm"
    type: "Regex"
    pattern: '\b[0-9]{9}\b'
  
  - id: "confidential_project"
    type: "Regex"
    pattern: '(?i)Project (Alpha|Omega|Zion)'
    action: "Block"

heuristics:
  - label: "POTENTIAL_NAME"
    pattern: '\b[A-Z\u0386\u0388-\u038A\u038C\u038E\u038F\u0391-\u03A9][\u03B1-\u03C9\u03AC-\u03CEa-z]+\b'
    skip_sentence_start: true

ai_enabled: true
ai_confidence_threshold: 0.85
