# Indian Compliance Rule Pack (DPDP Act 2023)
# Covers primary Indian personal and financial identifiers.

rules:
  - id: "in_pan"
    pattern: '\b[A-Z]{5}[0-9]{4}[A-Z]\b'
    type: "Regex"
    category: "IdentificationNumber"

  - id: "in_aadhaar"
    pattern: '\b[2-9]\d{3}[\s\-]?[0-9]{4}[\s\-]?[0-9]{4}\b'
    type: "Regex"
    category: "IdentificationNumber"

  - id: "in_gstin"
    pattern: '\b[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b'
    type: "Regex"
    category: "IdentificationNumber"

  - id: "in_passport"
    pattern: '\b[A-PR-WYa-pr-wy][1-9]\d{6}\b'
    type: "Regex"
    category: "IdentificationNumber"

  - id: "in_voter_id"
    pattern: '\b[A-Z]{3}[0-9]{7}\b'
    type: "Regex"
    category: "IdentificationNumber"

  - id: "in_phone"
    pattern: '\b(?:(?:\+91|0)[\s\-]?)?[6-9]\d{9}\b'
    type: "Regex"
    category: "ContactInfo"

heuristics:
  - label: "POTENTIAL_INDIAN_NAME"
    pattern: '\b(?:Shri|Smt|Kumar|Singh|Sharma|Patel|Gupta|Verma|Rao|Reddy|Nair|Pillai|Iyer|Iyengar|Mukherjee|Chatterjee|Banerjee|Das|Ghosh)\b'
    skip_sentence_start: false
    category: "PotentialHeuristic"
