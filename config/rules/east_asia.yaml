# East Asia Regional Compliance Rule Pack
# Covers China (PIPL), Japan (APPI), South Korea (PIPA), and Singapore (PDPA).

rules:
  # China Resident Identity Card (居民身份证 - 18 digits)
  - id: "cn_resident_id"
    pattern: '\b[1-9]\d{5}(?:18|19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx]\b'
    type: "Regex"
    category: "IdentificationNumber"

  # China Unified Social Credit Code (统一社会信用代码 - 18 alphanumeric chars)
  - id: "cn_uscc"
    pattern: '\b[0-9A-HJ-NPQRTUWXY]{2}\d{6}[0-9A-HJ-NPQRTUWXY]{10}\b'
    type: "Regex"
    category: "IdentificationNumber"

  # China Mobile Number (+86 1XX XXXX XXXX)
  - id: "cn_mobile"
    pattern: '\b(?:(?:\+86|0086)[\s\-]?)?1[3-9]\d{9}\b'
    type: "Regex"
    category: "ContactInfo"

  # Japan My Number (個人番号 - 12 digits)
  - id: "jp_my_number"
    pattern: '\b[1-9]\d{11}\b'
    type: "Regex"
    category: "IdentificationNumber"

  # South Korea Resident Registration Number (RRN 주민등록번호 - 13 digits: YYMMDD-GXXXXXX)
  - id: "kr_rrn"
    pattern: '\b\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])[\s\-]?[1-4]\d{6}\b'
    type: "Regex"
    category: "IdentificationNumber"

  # Singapore NRIC / FIN (S/T/F/G/M + 7 digits + check letter)
  - id: "sg_nric"
    pattern: '\b[STFGMstfgm]\d{7}[A-Za-z]\b'
    type: "Regex"
    category: "IdentificationNumber"

heuristics:
  - label: "POTENTIAL_EAST_ASIAN_NAME"
    pattern: '[\u4E00-\u9FFF\u3040-\u309F\u30A0-\u30FF\uAC00-\uD7AF]{2,4}'
    skip_sentence_start: false
    category: "PotentialHeuristic"
