apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ironwarden.fullname" . }}-config
  labels:
    {{- include "ironwarden.labels" . | nindent 4 }}
data:
  BRIDGE_PORT: {{ .Values.config.port | quote }}
  WARDEN_ENV: {{ .Values.config.environment | quote }}
  WARDEN_MODE: {{ .Values.config.mode | quote }}
  WARDEN_RULES_PROFILE: {{ .Values.config.rulesProfile | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  WARDEN_MAX_PERMITS: {{ .Values.config.maxConcurrentPermits | quote }}
