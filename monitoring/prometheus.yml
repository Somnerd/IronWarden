global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "ironwarden"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "ironwarden-gateway"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
