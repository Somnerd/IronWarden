#version: '3.8'
services:
  ironwarden:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironwarden
    ports:
      - "8080:8080"   # Universal AI Gateway Proxy (/v1/chat/completions, /v1/messages)
      - "14141:14141" # Stdio/HTTP MCP Control Plane
    environment:
      - PORT=8080
      - WARDEN_ENV=production
      - WARDEN_MODE=bridge
      - RUST_LOG=info
      - WARDEN_PEPPER=${WARDEN_PEPPER:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - WARDEN_MCP_SECRET=${WARDEN_MCP_SECRET:-default_mcp_secret_change_in_production}
      # Connect to external Redis (e.g. SearchBoost's Redis) or local Redis service:
      # If SearchBoost is not installed, it safely falls back to the local Redis container included below.
      # If installed later, simply set REDIS_URL to point to SearchBoost's instance.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - UPSTREAM_OPENAI_URL=${UPSTREAM_OPENAI_URL:-https://api.openai.com}
      - UPSTREAM_ANTHROPIC_URL=${UPSTREAM_ANTHROPIC_URL:-https://api.anthropic.com}
      - IGNORE_HA_ENFORCEMENT=true
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - redis

  # Optional local Redis instance (ignored if connecting to an external SearchBoost Redis via REDIS_URL)
  redis:
    image: redis:7.4-alpine
    container_name: iw_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
