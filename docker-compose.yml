#version: '3.8'
services:
  ironwarden:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironwarden
    ports:
      - "8080:8080"   # Universal AI Gateway Proxy (/v1/chat/completions, /v1/messages)
      - "14141:8080"  # Alternative Gateway Port
    environment:
      - PORT=8080
      - BRIDGE_PORT=8080
      - BRIDGE_ADDR=0.0.0.0
      - WARDEN_ENV=production
      - WARDEN_MODE=bridge
      - RUST_LOG=info
      - WARDEN_PEPPER=${WARDEN_PEPPER:?WARDEN_PEPPER must be set to a >=32-byte secret}
      - WARDEN_MCP_SECRET=${WARDEN_MCP_SECRET:?WARDEN_MCP_SECRET must be set}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set in production}
      - WARDEN_JWT_AUDIENCE=${WARDEN_JWT_AUDIENCE:-ironwarden}
      - WARDEN_JWT_ISSUER=${WARDEN_JWT_ISSUER:-ironwarden}
      # Connect to external Redis (e.g. SearchBoost's Redis) or local Redis service:
      # If SearchBoost is not installed, it safely falls back to the local Redis container included below.
      # If installed later, simply set REDIS_URL to point to SearchBoost's instance.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1/chat/completions}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1/messages}
      - IGNORE_HA_ENFORCEMENT=true
      # ONNX Runtime shared library — installed in runner image
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
      - ORT_DYLIB_PATH=/usr/lib/x86_64-linux-gnu/libonnxruntime.so
      # Disable OpenMP & Intel KMP busy-waiting & constrain thread pool in ONNX Runtime prebuilt binary
      - OMP_NUM_THREADS=1
      - OMP_WAIT_POLICY=PASSIVE
      - OMP_DYNAMIC=FALSE
      - KMP_BLOCKTIME=0
      - KMP_AFFINITY=disabled
      # 1 NER worker on this host; increase on multi-core Linux
      - WARDEN_NER_POOL_SIZE=1
    volumes:
      - ./config:/app/config:ro
      - ironwarden_logs:/app/logs
      - ironwarden_data:/app/data
    networks:
      - default
      # Uncomment if connecting directly to an existing SearchBoost Docker network:
      # - searchboost_net
    restart: unless-stopped
    depends_on:
      - redis

  # Optional local Redis instance (ignored if connecting to an external SearchBoost Redis via REDIS_URL)
  redis:
    image: redis:7.4-alpine
    container_name: iw_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  ironwarden_data:
  ironwarden_logs:
  redis_data:

networks:
  default:
  # Uncomment if connecting directly to an existing SearchBoost Docker network:
  # searchboost_net:
  #   external: true
  #   name: searchboost_default
